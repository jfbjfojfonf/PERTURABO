<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6ff3d"/>
      <stop offset="100%" stop-color="#a3e000"/>
    </linearGradient>
  </defs>

  <!-- solid black circular background -->
  <circle cx="400" cy="400" r="396" fill="#000000"/>

  <!-- shaker silhouette -->
  <g transform="translate(400, 430)">
    <g transform="rotate(-14 0 0)">
      <path d="M-170,-280 L170,-280 L190,120 L-190,120 Z" fill="url(#lime)"/>
      <path d="M-190,120 L-185,220 L185,220 L190,120 Z" fill="#14141c"/>
      <rect x="-185" y="-360" width="370" height="90" rx="18" fill="#e8e8f0"/>
      <circle cx="0" cy="-372" r="28" fill="#ffffff"/>
    </g>
    <!-- droplet / smiling face -->
    <path d="M-40,-560 Q-40,-620 0,-620 Q40,-620 40,-560 Q40,-520 0,-520 Q-40,-520 -40,-560 Z"
          fill="#ff2e55"/>
    <circle cx="-14" cy="-565" r="9" fill="#000000"/>
    <circle cx="14" cy="-565" r="9" fill="#000000"/>
    <path d="M-20,-540 Q0,-520 20,-540" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
