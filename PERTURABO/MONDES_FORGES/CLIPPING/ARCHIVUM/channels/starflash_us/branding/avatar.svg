<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <!-- circular avatar background -->
  <circle cx="400" cy="400" r="396" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="396" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>

  <!-- shooting star with trail -->
  <g transform="translate(400, 400)">
    <polygon points="0,-150 28,-35 150,0 28,35 0,150 -28,35 -150,0 -28,-35" fill="url(#gold)" opacity="0.95"/>
    <polygon points="0,-85 16,-20 85,0 16,20 0,85 -16,20 -85,0 -16,-20" fill="#ffffff" opacity="0.9"/>

    <!-- trail -->
    <polygon points="-160,80 -110,-20 -90,-10 -130,95" fill="url(#gold)" opacity="0.5"/>
    <polygon points="-190,120 -140,10 -120,20 -160,135" fill="url(#gold)" opacity="0.25"/>
  </g>
</svg>
