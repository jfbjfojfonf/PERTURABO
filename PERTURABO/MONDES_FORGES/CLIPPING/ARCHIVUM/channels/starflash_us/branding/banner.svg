<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="220" cy="180" r="3"/>
    <circle cx="480" cy="380" r="2"/>
    <circle cx="900" cy="120" r="2"/>
    <circle cx="1800" cy="200" r="3"/>
    <circle cx="2150" cy="420" r="2"/>
    <circle cx="2400" cy="150" r="2"/>
    <circle cx="300" cy="1100" r="2"/>
    <circle cx="700" cy="1250" r="3"/>
    <circle cx="1400" cy="1300" r="2"/>
    <circle cx="2100" cy="1150" r="2"/>
    <circle cx="2350" cy="1250" r="3"/>
    <circle cx="600" cy="700" r="1.5"/>
    <circle cx="1200" cy="180" r="1.5"/>
    <circle cx="1500" cy="1200" r="1.5"/>
  </g>

  <!-- shooting star (burst) above text -->
  <g transform="translate(1280, 560)">
    <polygon points="0,-120 22,-28 120,0 22,28 0,120 -22,28 -120,0 -22,-28" fill="url(#gold)" opacity="0.95"/>
    <polygon points="0,-70 13,-16 70,0 13,16 0,70 -13,16 -70,0 -13,-16" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- STARFLASH title -->
  <text x="1280" y="860" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="220" fill="#ffffff" letter-spacing="18">STARFLASH</text>

  <!-- US accent -->
  <text x="1280" y="1010" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="80" fill="url(#gold)" letter-spacing="40">U S</text>

  <!-- subtle baseline -->
  <line x1="1030" y1="1080" x2="1530" y2="1080" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>
</svg>
